# Production deployment for ChatBot5400 (Open Notebook + Auth/RBAC + i18n + Agribank UI).
#
# Builds the app FROM SOURCE (this branch) — the published image
# lfnovo/open_notebook:v1-latest does NOT contain our custom code
# (authentication, per-user data isolation, Vietnamese i18n, docling default,
# the Agribank redesign). Docling is a hard dependency now, so the built image
# is multi-GB and the first build is slow.
#
# Topology:
#   Caddy (:80/:443, automatic HTTPS)
#     ├── 5491sotay.io.vn      -> open_notebook:8502  (Next.js frontend)
#     └── api.5491sotay.io.vn  -> open_notebook:5055  (FastAPI)
#   open_notebook  -> surrealdb:8000  (internal compose network only)
#
# Run from this directory:  docker compose -f docker-compose.prod.yml up -d --build
# See DEPLOY-VPS.md for the full step-by-step runbook.

services:
  surrealdb:
    image: surrealdb/surrealdb:v2
    # exec form: keeps a password with spaces as one argument.
    # `:?` makes `docker compose up` FAIL LOUDLY if SURREAL_PASSWORD is empty or
    # unset, instead of silently initialising the datastore with an empty root
    # password (which then mismatches the app's default and causes
    # "problem with authentication").
    command: ["start", "--log", "info", "--user", "${SURREAL_USER:?set SURREAL_USER in .env}", "--pass", "${SURREAL_PASSWORD:?set SURREAL_PASSWORD in .env}", "rocksdb:/mydata/mydatabase.db"]
    user: root  # required for bind mounts on Linux
    volumes:
      - ./surreal_data:/mydata
    environment:
      - SURREAL_EXPERIMENTAL_GRAPHQL=true
    # No host port published: only the open_notebook service reaches SurrealDB,
    # over the internal compose network. Do NOT expose 8000 on 0.0.0.0.
    restart: always

  open_notebook:
    build:
      context: ..
      dockerfile: Dockerfile
      target: runtime
    environment:
      # REQUIRED — encrypts stored provider API keys. Never commit the real value.
      - OPEN_NOTEBOOK_ENCRYPTION_KEY=${OPEN_NOTEBOOK_ENCRYPTION_KEY}
      # Signs login JWTs. Set it so sessions survive restarts (else ephemeral).
      - OPEN_NOTEBOOK_JWT_SECRET=${OPEN_NOTEBOOK_JWT_SECRET}
      # Auth is ENFORCED in production. Do not set OPEN_NOTEBOOK_DISABLE_AUTH here.

      # Database (internal network).
      - SURREAL_URL=ws://surrealdb:8000/rpc
      - SURREAL_USER=${SURREAL_USER:?set SURREAL_USER in .env}
      - SURREAL_PASSWORD=${SURREAL_PASSWORD:?set SURREAL_PASSWORD in .env}
      - SURREAL_NAMESPACE=open_notebook
      - SURREAL_DATABASE=open_notebook

      # Public API origin the BROWSER should call (served by Caddy over HTTPS).
      - API_URL=${PUBLIC_API_URL}
      # Lock CORS to the frontend origin only (enables credentialed CORS).
      - CORS_ORIGINS=${PUBLIC_FRONTEND_URL}

      # Docling (layout-aware .docx/.pdf extraction — keeps Điều/Khoản numbering)
      # is NOT baked into the image (it would make the image multi-GB and
      # un-buildable on a small VPS). Instead it is installed on FIRST boot onto
      # the ./notebook_data volume below, so it survives restarts and rebuilds.
      # The first startup is therefore slower (downloads the ML stack once).
      - OPEN_NOTEBOOK_ENABLE_DOCLING=true
      # Install the CPU-only PyTorch build (this VPS has no GPU): a few hundred MB
      # instead of the ~5-6 GB CUDA stack. Falls back to the default build if the
      # uv version doesn't support this flag.
      - UV_TORCH_BACKEND=cpu
    volumes:
      # Persists uploads, chat checkpoints, and the runtime-installed Docling /
      # PyTorch packages + ML models (under /app/data/.cache) across restarts.
      - ./notebook_data:/app/data
    expose:
      - "8502"  # frontend  (internal only — Caddy publishes it)
      - "5055"  # API       (internal only — Caddy publishes it)
    depends_on:
      - surrealdb
    restart: always

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy_data:/data       # Let's Encrypt certs (persist across restarts)
      - ./caddy_config:/config
    depends_on:
      - open_notebook
    restart: always
