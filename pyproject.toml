[project]
name = "open-notebook"
version = "1.14.0"
description = "An open source implementation of a research assistant, inspired by Google Notebook LM"
authors = [
    {name = "Luis Novo", email = "lfnovo@gmail.com"}
]
readme = "README.md"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
]
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "pydantic>=2.9.2",
    "loguru>=0.7.2",
    "langchain>=1.3.9,<2",
    "langchain-core>=1.4.6,<2",
    "langchain-text-splitters>=1.1.2,<2",
    "langgraph>=1.0.5,<2",
    "tiktoken>=0.12.0",
    "langgraph-checkpoint-sqlite>=3.1.1,<4",
    # The langchain-* provider packages below have no direct imports in this
    # codebase: they are runtime requirements of esperanto's dynamic
    # `to_langchain()` (esperanto declares them only as optional extras).
    # deepseek/xai/openrouter/openai-compatible all route through
    # langchain-openai, so no dedicated packages are needed for them.
    "langchain-openai>=1.1.14,<2",
    "langchain-anthropic>=1.4.6,<2",
    "langchain-ollama>=1.0.1,<2",
    "langchain-google-genai>=4.1.2,<5",
    "langchain-groq>=1.1.1,<2",
    "langchain-mistralai>=1.1.1,<2",
    "tomli>=2.0.2",
    "python-dotenv>=1.2.2",
    "httpx[socks]>=0.27.0",
    # content-core provides document/URL extraction. The layout-aware Docling
    # parser (which keeps .docx/.pdf structure — headings, multi-level
    # Điều/Khoản lists) is heavy (Torch + ML models, ~several GB), so it is NOT
    # baked into the base install: it lives in the optional `docling` extra
    # below. The app falls back to the simple extractor automatically when
    # Docling is absent. Enable it either at install time (`uv sync --extra
    # docling`, e.g. local Windows) or at container runtime
    # (OPEN_NOTEBOOK_ENABLE_DOCLING=true installs it onto the persistent data
    # volume on first boot — see the production compose file). This keeps the
    # base Docker image small enough to build on a modest VPS.
    "content-core>=2.0.7,<3",
    "ai-prompter>=0.4,<1",
    "esperanto>=2.25.1,<3",
    "surrealdb>=1.0.4",
    "podcast-creator>=0.12.0,<1",
    "surreal-commands>=1.3.1,<2",
    "numpy>=2.4.1",
    "pycountry>=26.2.16",
    "babel>=2.18.0",
    # surreal-commands (worker) imports `typer`; pin it explicitly so the
    # resolver always installs the module (adding content-core[docling] can
    # otherwise drop typer-slim, which provides the `typer` module).
    "typer>=0.15",
    # Authentication / RBAC (added for ChatBot5400): password hashing + JWT tokens
    "bcrypt>=4.2.0",
    "pyjwt>=2.10.0",
]

[project.optional-dependencies]
# Layout-aware document extraction (keeps .docx/.pdf structure: headings and
# multi-level Điều/Khoản lists). Heavy (Torch + ML models). Install with
# `uv sync --extra docling`, or let the Docker entrypoint install it at runtime
# via OPEN_NOTEBOOK_ENABLE_DOCLING=true. The default document engine is already
# 'docling' (migration 28); the app falls back to the simple extractor when the
# package is absent.
docling = ["content-core[docling]>=2.0.7,<3"]

[tool.setuptools]
package-dir = {"open_notebook" = "open_notebook"}

[tool.setuptools.package-data]
open_notebook = ["ai/assets/*"]


[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "mypy>=1.11.1",
    "pre-commit>=4.1.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.13",
    "types-requests>=2.32.4.20250913",
]
notebooks = [
    "ipykernel>=6.29.5",
    "ipywidgets>=8.1.5",
]

[tool.isort]
profile = "black"
line_length = 88

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = [
    "E501",  # line too long
    "E402",  # module level import not at top of file (Streamlit requires this pattern)
    "F541",  # f-string without placeholders
]

[tool.uv]
# Pillow < 12.2.0 has open security advisories (PSD OOB write, FITS
# decompression bomb, PDF trailer DoS). The only thing holding it back is
# moviepy's `pillow<12` cap, pulled in via podcast-creator 0.12.0 — and
# moviepy only touches PIL in its video modules, which the audio-only podcast
# pipeline never imports. Drop this override once podcast-creator ships a
# release without moviepy (already removed on its main branch).
override-dependencies = ["pillow>=12.2.0"]
